name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            filament: '^4.0'
            laravel: '^11.28'
            testbench: '^9.0'
          - php: '8.3'
            filament: '^4.0'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.2'
            filament: '^5.0'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            filament: '^5.0'
            laravel: '^13.0'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Filament ${{ matrix.filament }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Configure dependency matrix
        run: |
          composer require --dev --no-update \
            "laravel/framework:${{ matrix.laravel }}" \
            "filament/filament:${{ matrix.filament }}" \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        # Laravel 11 is EOL, so no advisory-free release is available. Keep
        # compatibility coverage without weakening blocking for maintained rows.
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: ${{ matrix.laravel == '^11.28' && '0' || '1' }}
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run tests
        run: composer test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer format -- --test
      - run: composer analyse
